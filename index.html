<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ytConvert">
    <meta name="theme-color" content="#0f172a">
    <title>ytConvert</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary-accent: #38bdf8;
            --secondary-accent: #818cf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(129, 140, 248, 0.15) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            position: relative;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary-accent), var(--secondary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            color: white;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        .select-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        select {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: var(--primary-accent);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1.25rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-loading button .loading-spinner {
            display: block;
        }

        .status-loading button span {
            display: none;
        }

        .message {
            display: none;
            margin-top: 1.25rem;
            padding: 0.9rem 1.1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.6);
        }

        .message.show { display: block; }
        .message.error { border-color: rgba(248, 113, 113, 0.5); color: #fca5a5; }
        .message.success { border-color: rgba(34, 197, 94, 0.5); color: var(--success); }

        .platform-hint {
            min-height: 1.2rem;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .save-btn {
            margin-top: 0.75rem;
            padding: 0.9rem;
            font-size: 1rem;
        }

        button:disabled { opacity: 0.7; cursor: wait; transform: none; }

        .footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>ytConvert</h1>
            <p class="subtitle">YouTube, X (Twitter) & Instagram → MP3 / MP4</p>
            
            <form id="convertForm" action="/convert" method="post">
                <div class="form-group">
                    <input type="text" id="url" name="url" placeholder="Paste YouTube, X or Instagram link..." required>
                    <div class="platform-hint" id="platformHint"></div>
                </div>
                
                <div class="select-row">
                    <select id="format" name="format">
                        <option value="mp3">Audio (MP3)</option>
                        <option value="mp4">Video (MP4)</option>
                    </select>
                </div>

                <button type="submit" id="submitBtn">
                    <div class="loading-spinner"></div>
                    <span>Convert Now</span>
                </button>
            </form>
            <div class="message" id="message"></div>
        </div>
        <p class="footer">Made for efficient conversions • ytConvert v2.0</p>
    </div>

    <script>
        const form = document.getElementById('convertForm');
        const btn = document.getElementById('submitBtn');
        const urlInput = document.getElementById('url');
        const hint = document.getElementById('platformHint');
        const message = document.getElementById('message');

        const PLATFORMS = [
            { name: 'YouTube', re: /(^|\.)(youtube\.com|youtu\.be)$/ },
            { name: 'X (Twitter)', re: /(^|\.)(twitter\.com|x\.com)$/ },
            { name: 'Instagram', re: /(^|\.)instagram\.com$/ },
        ];

        function detectPlatform(value) {
            try {
                const url = new URL(/^https?:\/\//.test(value) ? value : 'https://' + value);
                const found = PLATFORMS.find(p => p.re.test(url.hostname.toLowerCase()));
                return found ? found.name : null;
            } catch { return null; }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message show ${type}`;
        }

        urlInput.addEventListener('input', () => {
            const value = urlInput.value.trim();
            const platform = value ? detectPlatform(value) : null;
            hint.textContent = !value ? '' : platform ? `✓ ${platform}` : 'Desteklenmeyen link';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.className = 'message';
            document.body.classList.add('status-loading');
            btn.disabled = true;

            try {
                const res = await fetch('/convert', { method: 'POST', body: new FormData(form) });
                if (!res.ok) throw new Error(await res.text());

                const filename = decodeURIComponent(res.headers.get('X-Filename') || 'download');
                const blob = await res.blob();
                const file = new File([blob], filename, { type: blob.type });

                urlInput.value = '';
                hint.textContent = '';

                // iPhone: paylaşım menüsü → "Videoyu Kaydet" ile direkt Fotoğraflar'a.
                // Safari paylaşımı kullanıcı dokunuşu istediği için ayrı bir butonla açılıyor.
                if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
                    showMessage(`Hazır: ${filename}`, 'success');
                    const saveBtn = document.createElement('button');
                    saveBtn.type = 'button';
                    saveBtn.className = 'save-btn';
                    saveBtn.textContent = file.type.startsWith('video') ? 'Fotoğraflar\'a kaydet / paylaş' : 'Kaydet / paylaş';
                    saveBtn.onclick = () => navigator.share({ files: [file] }).catch(() => {});
                    message.appendChild(saveBtn);
                } else {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(() => URL.revokeObjectURL(link.href), 60000);
                    showMessage(`İndirildi: ${filename}`, 'success');
                }
            } catch (err) {
                showMessage(err.message || 'Bir hata oluştu.', 'error');
            } finally {
                document.body.classList.remove('status-loading');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
