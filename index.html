<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ytConvert">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <title>ytConvert</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #0a0a0a;
            --muted: #8a8a8a;
            --line: #e6e6e6;
            --field: #f5f5f5;
            --ok: #1a7f37;
            --err: #cf222e;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --fg: #f2f2f2;
                --muted: #7a7a7a;
                --line: #222222;
                --field: #161616;
                --ok: #3fb950;
                --err: #ff7b72;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        main { width: 100%; max-width: 420px; }

        h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 24px;
        }

        h1 span { color: var(--muted); font-weight: 400; }

        input[type="text"] {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--field);
            color: var(--fg);
            font-size: 16px; /* iOS'ta odaklanınca zoom yapmasın */
            outline: none;
            transition: border-color .15s;
        }

        input[type="text"]:focus { border-color: var(--fg); }
        input::placeholder { color: var(--muted); }

        .hint {
            height: 20px;
            margin: 8px 2px 16px;
            font-size: 13px;
            color: var(--muted);
        }

        .row { display: flex; gap: 8px; }

        .seg {
            display: flex;
            padding: 3px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--field);
        }

        .seg input { display: none; }

        .seg label {
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 44px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
            transition: background .15s, color .15s;
        }

        .seg input:checked + label { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

        button {
            flex: 1;
            height: 52px;
            border: 0;
            border-radius: 12px;
            background: var(--fg);
            color: var(--bg);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .15s;
        }

        button:active { opacity: .8; }
        button:disabled { opacity: .5; cursor: wait; }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status-loading .spinner { display: block; }
        .status-loading button span { display: none; }

        .message {
            display: none;
            margin-top: 16px;
            font-size: 14px;
        }

        .message.show { display: block; }
        .message.error { color: var(--err); }
        .message.success { color: var(--ok); }

        .save-btn {
            width: 100%;
            margin-top: 12px;
            flex: none;
        }

        footer {
            margin-top: 40px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <h1>ytConvert <span>· X, Instagram, YouTube</span></h1>

        <form id="convertForm">
            <input type="text" id="url" name="url" placeholder="Link yapıştır" autocomplete="off" autocapitalize="off" spellcheck="false" required>
            <div class="hint" id="platformHint"></div>

            <div class="row">
                <div class="seg">
                    <input type="radio" name="format" id="fmt-mp4" value="mp4" checked>
                    <label for="fmt-mp4">Video</label>
                    <input type="radio" name="format" id="fmt-mp3" value="mp3">
                    <label for="fmt-mp3">Ses</label>
                </div>
                <button type="submit" id="submitBtn">
                    <div class="spinner"></div>
                    <span>İndir</span>
                </button>
            </div>
        </form>

        <div class="message" id="message"></div>
    </main>

    <script>
        const form = document.getElementById('convertForm');
        const btn = document.getElementById('submitBtn');
        const urlInput = document.getElementById('url');
        const hint = document.getElementById('platformHint');
        const message = document.getElementById('message');

        const PLATFORMS = [
            { name: 'YouTube', re: /(^|\.)(youtube\.com|youtu\.be)$/ },
            { name: 'X', re: /(^|\.)(twitter\.com|x\.com)$/ },
            { name: 'Instagram', re: /(^|\.)instagram\.com$/ },
        ];

        function detectPlatform(value) {
            try {
                const url = new URL(/^https?:\/\//.test(value) ? value : 'https://' + value);
                const found = PLATFORMS.find(p => p.re.test(url.hostname.toLowerCase()));
                return found ? found.name : null;
            } catch { return null; }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message show ${type}`;
        }

        urlInput.addEventListener('input', () => {
            const value = urlInput.value.trim();
            const platform = value ? detectPlatform(value) : null;
            hint.textContent = !value ? '' : platform ? platform : 'Desteklenmeyen link';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.className = 'message';
            document.body.classList.add('status-loading');
            btn.disabled = true;

            try {
                const res = await fetch('/convert', { method: 'POST', body: new FormData(form) });
                if (!res.ok) throw new Error(await res.text());

                const filename = decodeURIComponent(res.headers.get('X-Filename') || 'download');
                const blob = await res.blob();
                const file = new File([blob], filename, { type: blob.type });

                urlInput.value = '';
                hint.textContent = '';

                // iPhone: paylaşım menüsü → "Videoyu Kaydet" ile direkt Fotoğraflar'a.
                // Safari paylaşımı kullanıcı dokunuşu istediği için ayrı bir butonla açılıyor.
                if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
                    showMessage(filename, 'success');
                    const saveBtn = document.createElement('button');
                    saveBtn.type = 'button';
                    saveBtn.className = 'save-btn';
                    saveBtn.textContent = file.type.startsWith('video') ? 'Fotoğraflar\'a kaydet' : 'Kaydet';
                    saveBtn.onclick = () => navigator.share({ files: [file] }).catch(() => {});
                    message.appendChild(saveBtn);
                } else {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(() => URL.revokeObjectURL(link.href), 60000);
                    showMessage(`İndirildi · ${filename}`, 'success');
                }
            } catch (err) {
                showMessage(err.message || 'Bir hata oluştu.', 'error');
            } finally {
                document.body.classList.remove('status-loading');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
